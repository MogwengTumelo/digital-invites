<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- This line makes the page fit phone screens properly instead of looking zoomed out -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Become One</title>
<!-- Google Fonts: Pinyon Script (fancy handwriting), Cormorant Garamond (elegant titles), Jost (clean body text) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   1. COLOURS & BASICS
   CSS variables (the --names) let us define a colour once and reuse it
   everywhere. Change --wine here and the whole invite changes.
   light-dark(A, B) picks A on light-mode phones and B on dark-mode phones.
   ===================================================================== */
:root{color-scheme:light dark;
 --wine:#4a1426;--wine2:#2e0b17;--gold:#c6a15b;--gold2:#e6cf98;
 --bg:light-dark(#f6efe6,#1e0910);--paper:light-dark(#fffaf3,#2b0f19);
 --ink:light-dark(#2b1118,#f5e9e0);--soft:light-dark(#7a5a60,#c9aeb2);--line:light-dark(#e6d6c4,#4d2532)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
/* box-sizing:border-box means padding is counted INSIDE an element's width, which makes layouts predictable */
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Jost,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.05;text-wrap:balance;margin:0}
.script{font-family:"Pinyon Script",cursive;font-weight:400}
button,input,select,textarea{font:inherit}
/* A visible gold outline when someone uses the keyboard (Tab key) - good for accessibility */
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* =====================================================================
   2. FLOATING CONTROLS: language switch (top right) + music button (bottom right)
   position:fixed = they stay in the same place on screen even when you scroll.
   ===================================================================== */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10} /* the balloon/confetti canvas */
.lang{position:fixed;top:12px;right:12px;z-index:12;display:flex;padding:3px;gap:2px;border-radius:999px;
 background:#2e0b17cc;border:1px solid #c6a15b77;backdrop-filter:blur(6px)}
.lang button{min-height:38px;padding:0 14px;border:0;border-radius:999px;background:none;color:#f3e3cf;cursor:pointer;font-size:14px}
/* aria-pressed="true" marks the language that is currently chosen - we style it gold */
.lang button[aria-pressed=true]{background:var(--gold);color:#2b1118;font-weight:500}
.sound{position:fixed;bottom:16px;right:16px;z-index:12;width:48px;height:48px;border-radius:50%;
 background:var(--wine);color:#f7ead9;border:1px solid var(--gold);cursor:pointer;display:none;place-items:center;
 box-shadow:0 8px 20px -8px #000a}
.sound.on{display:grid}
.sound svg{width:22px;height:22px}

/* =====================================================================
   3. LANDING PAGE
   Top to bottom: couple photo -> headline -> envelope -> "surprise" line -> date & place
   ===================================================================== */
#landing{position:fixed;inset:0;z-index:5;overflow-y:auto;display:grid;align-content:center;justify-items:center;
 padding:64px 20px 32px;color:#f7ead9;
 background:radial-gradient(120% 80% at 50% 25%,#6b1f37 0%,var(--wine) 45%,var(--wine2) 100%);
 transition:opacity .8s,visibility .8s}
#landing.gone{opacity:0;visibility:hidden}
.stage{display:grid;justify-items:center;gap:16px;width:min(480px,100%)}
/* The client's photo in a round gold frame. The gradient background IS the gold ring,
   and padding controls how thick the ring is. */
.portrait{width:clamp(104px,28vw,140px);aspect-ratio:1;border-radius:50%;padding:4px;
 background:linear-gradient(135deg,var(--gold2),var(--gold) 50%,#8a6a2e);box-shadow:0 14px 30px -12px #000c}
.portrait img,.portrait .mono{width:100%;height:100%;border-radius:50%;border:3px solid var(--wine2);object-fit:cover;display:block}
/* .mono = the fallback if there is no photo yet: the couple's initials */
.portrait .mono{display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#7c2a44,#2e0b17);
 font-family:"Pinyon Script",cursive;font-size:clamp(32px,9vw,44px);color:var(--gold2)}
.headline{font-family:"Pinyon Script",cursive;font-weight:400;font-size:clamp(40px,10vw,58px);line-height:1.1;color:var(--gold2);text-align:center;margin:0}
.surprise{margin:4px 0 0;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:21px;text-align:center}
/* Small date + location line with little icons */
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:14px;color:#e8d3c0}
.meta span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.meta svg{width:15px;height:15px;color:var(--gold)}

/* THE ENVELOPE is built from stacked layers, like paper on a table.
   z-index decides which layer is on top (bigger number = closer to you):
     .back (0) inside of the envelope · .letter (1) the card inside
     .front (3) the pocket · .flap (4) the top flap · .seal (5) the wax seal */
.env{position:relative;width:min(380px,80vw);aspect-ratio:3/2;perspective:1400px;margin-top:6px}
.env .back{position:absolute;inset:0;z-index:0;background:#efe3d0;border-radius:7px;box-shadow:0 30px 60px -20px #000a}
.letter{position:absolute;z-index:1;left:6%;right:6%;top:8%;height:84%;background:var(--paper);color:var(--ink);border-radius:4px;
 display:grid;place-items:center;text-align:center;padding:8%;border:1px solid #e6d6c4;
 transition:transform .9s cubic-bezier(.25,.8,.25,1)} /* we only animate transform - phones do this smoothly */
.letter .script{font-size:clamp(24px,6vw,36px);color:var(--wine)}
/* The pocket and the flap are now drawn as SVG (vector shapes) instead of CSS clip-path.
   Why? SVG lets us draw thin "fold lines" along every edge, so the paper panels look
   crisp and sharp instead of blurring into each other. */
.front,.flap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.front{z-index:3;border-radius:6px;overflow:hidden;pointer-events:none} /* overflow:hidden rounds the bottom corners */
/* The fold lines: thin, slightly darker paper colour. non-scaling-stroke keeps them exactly
   1px thin on every screen size, which is what makes the edges look sharp. */
.front path,.flap path{stroke:#b89d72;stroke-opacity:.6;stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
/* transform-origin:top = the flap hinges along its top edge, like a real envelope */
.flap{position:absolute;z-index:4;left:0;right:0;top:0;height:58%;transform-origin:top;transition:transform .7s cubic-bezier(.5,0,.3,1);
 filter:drop-shadow(0 2px 2px rgba(80,50,20,.18))} /* a soft shadow where the flap lies on the pocket */
.seal{position:absolute;z-index:5;left:50%;top:58%;width:clamp(74px,19vw,96px);aspect-ratio:1;transform:translate(-50%,-50%);
 border:0;padding:0;background:none;cursor:pointer;border-radius:50%;animation:nudge 2.4s ease-in-out 1.2s infinite}
/* A gentle "tap me" wobble on the seal until it is broken */
@keyframes nudge{0%,80%,100%{transform:translate(-50%,-50%) rotate(0)}85%{transform:translate(-50%,-50%) rotate(-6deg)}90%{transform:translate(-50%,-50%) rotate(6deg)}95%{transform:translate(-50%,-50%) rotate(-3deg)}}
/* The seal is drawn THREE times:
   .whole = the unbroken seal you see at first (no crack line through it)
   .l / .r = two halves, hidden until the seal breaks, then they fly apart.
   The shadow sits on the button itself so it is never cut into a square. */
.seal{filter:drop-shadow(0 6px 7px rgba(0,0,0,.45))}
.seal .whole,.seal .half{position:absolute;inset:0}
.seal .half{opacity:0;transition:transform .6s cubic-bezier(.5,0,.6,1),opacity .6s}
.seal svg{width:100%;height:100%;display:block}
/* The two halves overlap a tiny bit along the crack so no gap shows between them */
.seal .l{clip-path:polygon(-10% -10%,53% -10%,45% 40%,57% 62%,47% 110%,-10% 110%)}
.seal .r{clip-path:polygon(51% -10%,110% -10%,110% 110%,45% 110%,55% 62%,43% 40%)}
.tap{display:flex;align-items:center;gap:10px;background:none;border:1px solid #c6a15b88;color:#f7ead9;border-radius:999px;
 padding:10px 22px;min-height:44px;cursor:pointer;transition:opacity .4s}
.tap span{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite}
.hide{opacity:0;pointer-events:none}
@keyframes pulse{50%{opacity:.25}}

/* ---------- THE OPENING SEQUENCE ----------
   JavaScript adds these classes ONE AT A TIME, in order. Each class only changes
   a transform, and the "transition" rules above turn it into smooth movement. */
.seal-broken .seal{pointer-events:none;animation:none}                               /* Step 1 */
/* the whole seal disappears instantly and the two halves take its place, then fly apart */
.seal-broken .seal .whole{opacity:0}
.seal-broken .seal .half{animation:crack .6s cubic-bezier(.5,0,.6,1) forwards}
.seal-broken .seal .l{--dx:-46px;--rot:-35deg}
.seal-broken .seal .r{--dx:46px;--rot:35deg}
@keyframes crack{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(var(--dx),40px) rotate(var(--rot))}}
.flap-open .flap{transform:rotateX(180deg)}                                           /* Step 2 */
.flap-behind .flap{z-index:0}  /* Step 3: only AFTER the flap has finished opening (the old bug!) */
.letter-up .letter{transform:translateY(-58%)}                                        /* Step 4 */

/* =====================================================================
   4. THE INVITATION CARD (grows out of the letter)
   ===================================================================== */
#note{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:6;visibility:hidden;overflow-y:auto}
#note::before{content:"";position:fixed;inset:0;background:#1a050cc8;opacity:0;transition:opacity .6s}
#note.show{visibility:visible}
#note.show::before{opacity:1}
.card{position:relative;width:min(420px,100%);background:var(--paper);color:var(--ink);border-radius:6px;
 padding:clamp(30px,7vw,48px) clamp(22px,6vw,40px);text-align:center;box-shadow:0 40px 80px -30px #000;will-change:transform}
/* two thin gold frames, like an engraved card */
.card::before,.card::after{content:"";position:absolute;border:1px solid var(--gold);border-radius:3px;pointer-events:none}
.card::before{inset:10px;opacity:.8}.card::after{inset:15px;opacity:.35}
.card .inner{opacity:0;transition:opacity .5s .5s} /* words fade in after the card has grown */
#note.show .card .inner{opacity:1}
.card .guest{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(24px,6.5vw,30px);line-height:1.15;margin:0 0 6px;color:#8a6a2e}
:root[data-theme=dark] .card .guest{color:var(--gold2)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .card .guest{color:var(--gold2)}}
.card .top{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:20px;color:var(--soft);margin:0}
.card .names{font-family:"Pinyon Script",cursive;font-weight:400;font-size:clamp(46px,12vw,60px);line-height:1.15;color:var(--wine);margin:8px 0 4px}
:root[data-theme=dark] .card .names{color:var(--gold2)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .card .names{color:var(--gold2)}}
.card .sub{font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:600;letter-spacing:.06em;margin:0 0 16px}
.rule{width:70px;height:1px;background:var(--gold);margin:0 auto 16px;border:0}
.card .date{margin:0 0 24px;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 28px;border-radius:999px;
 background:var(--wine);color:#fbefe0;border:0;cursor:pointer;text-decoration:none;font-weight:500}
.btn.gold{background:var(--gold);color:#2b1118}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}

/* =====================================================================
   5. DETAILS PAGE
   ===================================================================== */
#details{display:none}
#details.on{display:block}
.hero{background:radial-gradient(110% 90% at 50% 0%,#6b1f37,var(--wine) 50%,var(--wine2));color:#f7ead9;text-align:center;
 padding:clamp(64px,10vw,110px) 20px clamp(48px,8vw,80px)}
.hero .script{font-size:clamp(54px,13vw,96px);color:var(--gold2);line-height:1}
.hero .amp{display:block;font-size:.55em;color:#f7ead9;margin:-4px 0}
.hero p{margin:18px auto 0;max-width:34ch;font-family:"Cormorant Garamond",serif;font-size:21px;font-style:italic}
.count{display:flex;justify-content:center;gap:clamp(14px,4vw,36px);margin-top:30px;flex-wrap:wrap}
.count div{min-width:64px}
.count b{display:block;font-family:"Cormorant Garamond",serif;font-size:clamp(32px,7vw,44px);font-weight:600;line-height:1;color:#fff}
.count small{font-size:13px;color:var(--gold2)}
main{width:min(720px,100%);margin:0 auto;padding:clamp(28px,5vw,56px) 18px 40px;display:grid;gap:22px}
section.box{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:clamp(22px,5vw,36px)}
section.box h2{font-size:clamp(30px,6vw,38px);margin-bottom:14px}
.lbl{color:var(--soft);font-size:14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media(max-width:560px){.row2{grid-template-columns:minmax(0,1fr)}} /* stack columns on phones */
.big{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;line-height:1.2}
.maprow{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 6px}
.sw{display:grid;justify-items:center;gap:6px;font-size:13px;color:var(--soft)}
.sw i{width:52px;height:52px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.prog{list-style:none;margin:0;padding:0}
.prog li{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.prog li:first-child{border-top:0}
.prog time{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;color:var(--wine);white-space:nowrap}
:root[data-theme=dark] .prog time{color:var(--gold2)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .prog time{color:var(--gold2)}}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.gallery label{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;cursor:pointer;
 background:linear-gradient(160deg,#7a2a43,#3a0f1d);display:grid;place-items:center;color:#f3dfc7;font-size:13px;text-align:center}
.gallery label:nth-child(2){background:linear-gradient(160deg,#c6a15b,#7d5a2a)}
.gallery label:nth-child(3){background:linear-gradient(160deg,#9b6b74,#4a1426)}
.gallery img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gallery input{position:absolute;opacity:0;width:1px;height:1px}
.gallery svg{width:46%;opacity:.55;margin-bottom:8px}
@media(max-width:480px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery label:nth-child(3){display:none}}
form{display:grid;gap:16px}
.f{display:grid;gap:6px}
input[type=text],select,textarea{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;
 background:var(--bg);color:var(--ink);font-size:16px}
textarea{min-height:90px;resize:vertical}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice label{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line);border-radius:6px;cursor:pointer;text-align:center;padding:8px}
.choice input{position:absolute;opacity:0}
.choice label:has(input:checked){border-color:var(--wine);background:color-mix(in srgb,var(--wine) 10%,transparent);font-weight:500}
.choice label:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:2px}
#done{display:none;text-align:center;padding:10px 0}
#done.on{display:block}
#done .big{margin-bottom:8px}
.err{color:#b3261e;font-size:14px;min-height:1em}
footer{text-align:center;color:var(--soft);font-size:13px;padding:10px 18px 80px}
.reseal{background:none;border:0;color:var(--soft);text-decoration:underline;cursor:pointer;font-size:13px;min-height:44px}
/* Some people turn off animations in their phone settings (motion sickness). We respect that. */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- Drawing surface for balloons + confetti, language switch, music button, and the music itself -->
<canvas id="fx" aria-hidden="true"></canvas>
<div class="lang" id="lang" role="group" aria-label="Language"></div>
<button class="sound" id="sound" aria-label="Pause music"></button>
<audio id="music" loop preload="auto"></audio>

<!-- ============ LANDING ============
     Notice: most text elements are EMPTY and have data-t="someKey".
     JavaScript fills them in from the INVITE settings, in the chosen language. -->
<div id="landing">
 <div class="stage">
  <div class="portrait" id="portrait"><div class="mono" id="mono"></div></div>
  <h1 class="headline" data-t="headline"></h1>
  <div class="env" id="env">
   <div class="back"></div>
   <div class="letter" id="letter"><div class="script" data-t="letter"></div></div>
   <!-- The pocket: left fold, right fold, bottom fold. Each <path> is one paper panel.
        "M x y" = move the pen to a point, "L" = draw a straight line, "Q" = a slight curve
        (we round the point where the folds meet), "Z" = close the shape. -->
   <svg class="front" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
    <defs>
     <linearGradient id="sideG" x1="0" x2="1"><stop offset="0" stop-color="#f7efe2"/><stop offset="1" stop-color="#efe4d1"/></linearGradient>
     <linearGradient id="pocketG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe3cf"/><stop offset="1" stop-color="#e2d1b5"/></linearGradient>
     <linearGradient id="flapG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece0ca"/><stop offset="1" stop-color="#dcc9a7"/></linearGradient>
     <filter id="foldShadow"><feDropShadow dx="0" dy="-1" stdDeviation="1.2" flood-color="#5a3a1a" flood-opacity=".14"/></filter>
    </defs>
    <path d="M0 6 L144 109 Q150 114 144 120 L0 194 Z" fill="url(#sideG)"/>
    <path d="M300 6 L156 109 Q150 114 156 120 L300 194 Z" fill="url(#sideG)"/>
    <path d="M0 194 L143 104 Q150 99 157 104 L300 194 Q300 200 294 200 L6 200 Q0 200 0 194 Z" fill="url(#pocketG)" filter="url(#foldShadow)"/>
   </svg>
   <!-- The flap: rounded top corners (to match the envelope) and a softened tip -->
   <div class="flap"><svg viewBox="0 0 300 116" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 6 Q0 0 6 0 H294 Q300 0 300 6 L156 112 Q150 117 144 112 Z" fill="url(#flapG)"/>
   </svg></div>
   <button class="seal" id="seal">
    <div class="whole"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#wax"/></svg></div>
    <div class="half l"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#wax"/></svg></div>
    <div class="half r"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#wax"/></svg></div>
   </button>
  </div>
  <p class="surprise" id="surprise" data-t="surprise"></p>
  <button class="tap" id="tap"><span></span><b data-t="tap" style="font-weight:400"></b></button>
  <div class="meta">
   <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><b data-t="shortDate" style="font-weight:400"></b></span>
   <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><b data-t="town" style="font-weight:400"></b></span>
  </div>
 </div>
</div>

<!-- ============ THE INVITATION CARD ============ -->
<div id="note" role="dialog" aria-modal="true" aria-labelledby="cardNames">
 <div class="card" id="card">
  <div class="inner">
   <p class="guest" id="guestName"></p> <!-- filled in by JavaScript from the link: ?guest=Name -->
   <p class="top" data-t="cardTop"></p>
   <h2 class="names" id="cardNames" data-t="names"></h2>
   <p class="sub" data-t="cardSub"></p>
   <hr class="rule">
   <p class="date" data-t="cardDate"></p>
   <button class="btn" id="toDetails" data-t="viewDetails"></button>
  </div>
 </div>
</div>

<!-- ============ DETAILS page ============ -->
<div id="details">
 <header class="hero">
  <h1 class="script" data-t="heroNames"></h1>
  <p data-t="heroLine"></p>
  <div class="count" id="count" aria-label="Countdown"></div>
 </header>

 <main>
  <section class="box">
   <h2 data-t="whenWhere"></h2>
   <div class="row2">
    <div><div class="lbl" data-t="lblDate"></div><div class="big" data-t="bigDate"></div></div>
    <div><div class="lbl" data-t="lblStart"></div><div class="big"><span data-t="startTime"></span><br><span class="lbl" data-t="arrive"></span></div></div>
   </div>
   <div style="margin-top:18px"><div class="lbl" data-t="lblVenue"></div>
    <div class="big" data-t="venue"></div>
    <div data-t="address"></div></div>
   <div class="maprow"><a class="btn" id="mapLink" href="#" data-t="openMaps"></a></div>
  </section>

  <section class="box">
   <h2 data-t="themeTitle"></h2>
   <p class="big" style="font-size:22px" data-t="themeName"></p>
   <div class="swatches" id="swatches"></div>
   <p class="lbl" data-t="dressNote"></p>
  </section>

  <section class="box">
   <h2 data-t="dayTitle"></h2>
   <ul class="prog" id="prog"></ul>
  </section>

  <section class="box">
   <h2 data-t="storyTitle"></h2>
   <p data-t="story"></p>
   <div class="gallery" id="gallery"></div>
  </section>

// Everything below is wrapped in { } so our variable names don't clash with anything else.
{
 // ----------------------------------------------------------------------
 // SMALL HELPERS
 // ----------------------------------------------------------------------
 const $ = s => document.querySelector(s);                           // find one element
 const wait = ms => new Promise(resolve => setTimeout(resolve, ms)); // "await wait(500)" = pause 0.5 s
 const calm = matchMedia('(prefers-reduced-motion: reduce)').matches; // user turned off animations?

 const landing = $('#landing'), env = $('#env'), letter = $('#letter'), tap = $('#tap');
 const note = $('#note'), card = $('#card'), details = $('#details');
 const music = $('#music'), soundBtn = $('#sound');
 const WEDDING = new Date(INVITE.weddingDate);

 // ======================================================================
 // GUEST NAME FROM THE LINK
 // Each guest gets their own link, e.g.  .../digital-invites/?guest=Mpho%20Dlamini
 // Everything after "?" is the "query string". URLSearchParams reads it for us,
 // and turns %20 back into a space.
 // .slice(0, 60) = keep at most 60 characters, so a silly link can't break the layout.
 // ======================================================================
 const guestName = (new URLSearchParams(location.search).get('guest') || '').trim().slice(0, 60);

 // ======================================================================
 // LANGUAGES
 // T always points at the text for the CURRENT language, e.g. T.headline
 // ======================================================================
 let lang = INVITE.defaultLang;
 try { const saved = localStorage.getItem('inviteLang'); if (INVITE.text[saved]) lang = saved; } catch (e) {}
 let T = INVITE.text[lang];

 function setLang(newLang) {
  lang = newLang;
  T = INVITE.text[lang];
  document.documentElement.lang = lang;   // tells the browser (and screen readers) which language the page is in
  try { localStorage.setItem('inviteLang', lang); } catch (e) {}

  // 1. Every element with data-t="key" gets the text T[key].
  //    We use innerHTML (not textContent) because some of OUR texts contain <br> or &amp;.
  //    That is safe here only because the text comes from our own settings, not from guests.
  document.querySelectorAll('[data-t]').forEach(el => {
   const value = T[el.dataset.t];
   if (typeof value === 'string') el.innerHTML = value;
  });

  // 2. Things built from lists: the programme, the colour swatches, the photo boxes
  $('#prog').innerHTML = T.programme.map(([time, what]) => `<li><time>${time}</time><div>${what}</div></li>`).join('');
  $('#swatches').innerHTML = INVITE.colours.map((c, i) => `<div class="sw"><i style="background:${c}"></i>${T.swatchNames[i] || ''}</div>`).join('');
  document.querySelectorAll('.gallery .hint').forEach(h => h.textContent = T.addPhoto);

  // 3. Small extras: placeholder text, labels for screen readers, the language buttons
  $('#gDiet').placeholder = T.dietPh;
  // IMPORTANT: the guest name comes from the LINK, and anyone can type anything into a link.
  // So we use textContent (shows it as plain text), never innerHTML (which would run any
  // HTML/code hidden in it). This protects against an attack called XSS (cross-site scripting).
  $('#guestName').textContent = (guestName || T.guestFallback) + ',';
  $('#seal').setAttribute('aria-label', T.sealLabel);
  updateSoundButton();
  document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  tick(); // redraw the countdown with the new words
 }

 // Build the language buttons from INVITE.langNames (so a client could have any two languages)
 $('#lang').innerHTML = Object.entries(INVITE.langNames)
  .map(([code, name]) => `<button data-lang="${code}" aria-pressed="false">${name}</button>`).join('');
 $('#lang').addEventListener('click', e => {
  const b = e.target.closest('button');   // which button was clicked?
  if (b) setLang(b.dataset.lang);
 });

 // ======================================================================
 // CLIENT PHOTO + SEAL INITIALS
 // We try to load the photo. If the file is missing, we keep the initials circle instead.
 // ======================================================================
 $('#mono').textContent = INVITE.initials.replace('&', ' & ');
 $('#sealText').textContent = INVITE.initials;
 if (INVITE.photo) {
  const img = new Image();
  img.alt = 'The couple';
  img.onload = () => $('#portrait').replaceChildren(img); // swap the initials for the photo
  img.src = INVITE.photo;                                // onerror: do nothing, initials stay
 }
 $('#mapLink').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(INVITE.mapQuery);

 // Photo boxes on the details page (built with a loop instead of copy-pasting the HTML 3 times)
 const camIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-5-5-8 7"/></svg>';

 // MUSIC
 // Browsers block sound until the person taps something. Breaking the seal
 // IS a tap, so that is the perfect moment to start the song.
 // ======================================================================
 const pauseIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
 const mutedIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
 let musicOK = !!INVITE.music;            // !! turns a value into true/false
 if (musicOK) music.src = INVITE.music;
 music.addEventListener('error', () => { musicOK = false; soundBtn.classList.remove('on'); }); // no file? hide the button

 function updateSoundButton() {
  const playing = !music.paused;
  soundBtn.innerHTML = playing ? pauseIcon : mutedIcon;

 async function startMusic() {
  if (!musicOK) return;
  try {
   music.volume = 0;

   // Fade in over ~2 seconds: raise the volume a little every 100 ms

 // ======================================================================
 // CELEBRATION EFFECTS: confetti + balloons drawn on the <canvas>
 // (a "module": runs once, keeps its variables private, and returns only
 //  the three tools we need: confetti, launchBalloons, popAt)
 // ======================================================================
 const fx = (() => {
  const cvs = $('#fx'), ctx = cvs.getContext('2d'); // ctx is our "paintbrush"
  let W = 0, H = 0, bits = [], balloons = [], running = false, last = 0;
  const COLORS = ['#7c1a2f', '#a8324f', '#c6a15b', '#e6cf98', '#f3e6d3'];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // Match the canvas to the screen. devicePixelRatio stops blurry drawings on phones.
  function resize() {
   const dpr = Math.min(window.devicePixelRatio || 1, 2);
   W = innerWidth; H = innerHeight;
   cvs.width = W * dpr; cvs.height = H * dpr;
   ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // CONFETTI: n pieces shooting out from (x, y) in random directions
  function confetti(x, y, n, colors = COLORS) {
   if (calm) return;
   for (let i = 0; i < n; i++) {
    const angle = rand(0, Math.PI * 2), speed = rand(3, 11);
    bits.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 4,
     rot: rand(0, 6.28), vr: rand(-.3, .3), w: rand(6, 11), h: rand(3, 6), c: pick(colors), life: rand(110, 170) });
   }
   start();
  }

  // BALLOONS: n balloons starting below the screen, staggered so they arrive one after another
  function launchBalloons(n) {
   if (calm) return;
   for (let i = 0; i < n; i++) {
    const r = rand(22, 34);
    balloons.push({ x: rand(r, W - r), y: H + rand(r * 2, H * 0.6), r, vy: rand(1.1, 2),
     ph: rand(0, 6.28), sw: rand(.6, 1.4), c: pick(COLORS.slice(0, 4)), t: 0 });
   }
   start();
  }

  function drawBalloon(b) {
   const x = b.x + Math.sin(b.t * 0.03 * b.sw + b.ph) * 12; // sin() = smooth left-right sway
   b.drawX = x;
   ctx.strokeStyle = 'rgba(150,120,110,.6)'; ctx.lineWidth = 1;          // string
   ctx.beginPath(); ctx.moveTo(x, b.y + b.r * 1.2);
   ctx.quadraticCurveTo(x + Math.sin(b.t * 0.05 + b.ph) * 10, b.y + b.r * 2.2, x, b.y + b.r * 3.2); ctx.stroke();
   ctx.fillStyle = b.c;                                                    // knot
   ctx.beginPath(); ctx.moveTo(x, b.y + b.r * 1.15); ctx.lineTo(x - 5, b.y + b.r * 1.32); ctx.lineTo(x + 5, b.y + b.r * 1.32);
   ctx.closePath(); ctx.fill();
   const g = ctx.createRadialGradient(x - b.r * .35, b.y - b.r * .45, b.r * .1, x, b.y, b.r * 1.3); // shiny body
   g.addColorStop(0, 'rgba(255,255,255,.75)'); g.addColorStop(.3, b.c); g.addColorStop(1, b.c);
   ctx.fillStyle = g;
   ctx.beginPath(); ctx.ellipse(x, b.y, b.r, b.r * 1.2, 0, 0, Math.PI * 2); ctx.fill();
  }

  // THE ANIMATION LOOP (~60 times a second): clear, move everything a little, draw again.
  function frame(now) {
   const k = Math.min((now - last) / 16.67, 3) || 1; // keeps speed the same on slow and fast phones
   last = now;
   ctx.clearRect(0, 0, W, H);
   balloons = balloons.filter(b => { b.t += k; b.y -= b.vy * k; drawBalloon(b); return b.y > -b.r * 4; });
   bits = bits.filter(p => {
    p.vx *= .985; p.vy = p.vy * .985 + .25 * k;       // air resistance + gravity
    p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k; p.life -= k;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.scale(1, Math.cos(p.rot * 2));                // squash while spinning = paper flipping
    ctx.globalAlpha = Math.min(1, p.life / 30);       // fade out at the end
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    return p.life > 0 && p.y < H + 20;
   });
   if (balloons.length || bits.length) requestAnimationFrame(frame);
   else { running = false; ctx.clearRect(0, 0, W, H); } // nothing left = stop looping, save battery
  }
  function start() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } }

  // Tapped inside a balloon's oval? Pop it into confetti.
  function popAt(x, y) {
   const i = balloons.findIndex(b => Math.hypot((x - b.drawX) / b.r, (y - b.y) / (b.r * 1.2)) < 1);
   if (i < 0) return false;
   const b = balloons.splice(i, 1)[0];
   confetti(b.drawX, b.y, 40, [b.c, '#e6cf98', '#ffffff']);
   return true;
  }
  return { confetti, launchBalloons, popAt };
 })();

 // Popping a balloon that floats over a button should NOT also press that button
 let swallowClick = false;
 document.addEventListener('pointerdown', e => {
  if (fx.popAt(e.clientX, e.clientY)) { swallowClick = true; setTimeout(() => swallowClick = false, 400); }
 });
 document.addEventListener('click', e => {
  if (swallowClick) { swallowClick = false; e.stopPropagation(); e.preventDefault(); }
 }, true); // true = catch the click BEFORE it reaches the button

 // ======================================================================
 // THE OPENING SEQUENCE - "async" lets us write the steps in order with "await"
 // ======================================================================
 let opening = false; // stops the sequence running twice if someone taps fast

 async function openInvite() {
  if (opening) return;
  opening = true;
  tap.classList.add('hide');
  $('#surprise').classList.add('hide');
  startMusic();                                           // must happen right after the tap (browser rule)

  // Step 1: break the seal + confetti bursts out from where it was
  env.classList.add('seal-broken');
  const s = $('#seal').getBoundingClientRect();
  fx.confetti(s.left + s.width / 2, s.top + s.height / 2, 140);
  await wait(calm ? 0 : 300);

  // Step 2: swing the flap open, and WAIT until it has finished (.7s in the CSS)
  env.classList.add('flap-open');
  await wait(calm ? 0 : 700);

  // Steps 3 + 4: now it's safe to put the flap behind, and slide the letter up in front
  env.classList.add('flap-behind', 'letter-up');
  await wait(calm ? 0 : 850);

  // Step 5: the letter grows into the invitation card, with more confetti and balloons
  growCard();
  fx.confetti(innerWidth / 2, innerHeight * 0.35, 90);
  fx.launchBalloons(14);
 }

 // "FLIP" animation (First, Last, Invert, Play):
 // measure the small letter (First), show the card and measure it (Last),
 // instantly shrink the card onto the letter (Invert), then let it grow back (Play).
 function growCard() {
  const from = letter.getBoundingClientRect();
  note.classList.add('show');
  const to = card.getBoundingClientRect();
  const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
  const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
  card.style.transition = 'none';
  card.style.transform = `translate(${dx}px, ${dy}px) scale(${from.width / to.width}, ${from.height / to.height})`;
  letter.style.visibility = 'hidden';
  card.getBoundingClientRect();                   // forces the browser to apply the line above first
  card.style.transition = calm ? 'none' : 'transform .8s cubic-bezier(.2,.8,.2,1)';
  card.style.transform = '';
  setTimeout(() => $('#toDetails').focus({ preventScroll: true }), 900);
 }

 $('#seal').addEventListener('click', openInvite);
 tap.addEventListener('click', openInvite);

 // ----------------------------------------------------------------------
 // GO TO THE DETAILS PAGE, and "seal again" to replay (handy for demos)
 // ----------------------------------------------------------------------
 $('#toDetails').addEventListener('click', () => {
  note.classList.remove('show');
  landing.classList.add('gone');
  details.classList.add('on');
  window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#details'); } catch (e) {}
 });
 $('#reseal').addEventListener('click', () => {
  details.classList.remove('on');
  landing.classList.remove('gone');
  env.classList.remove('seal-broken', 'flap-open', 'flap-behind', 'letter-up');
  letter.style.visibility = '';
  card.style.transform = ''; card.style.transition = '';
  tap.classList.remove('hide'); $('#surprise').classList.remove('hide');
  opening = false;
  try { history.replaceState(null, '', '#'); } catch (e) {}
 });
 if (location.hash === '#details') { landing.classList.add('gone'); details.classList.add('on'); }

 // ----------------------------------------------------------------------
 // COUNTDOWN (uses the words of the current language: T.count)
 // ----------------------------------------------------------------------
 function tick() {
  const ms = Math.max(0, WEDDING - new Date());
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
  $('#count').innerHTML = ms
   ? [d, h, m].map((v, i) => `<div><b>${v}</b><small>${T.count[i]}</small></div>`).join('')
   : `<div><b>${T.today}</b></div>`;
 }
 setInterval(tick, 30000);

 // ----------------------------------------------------------------------
 // PHOTOS on the details page - preview a picture the moment someone picks one
 // ----------------------------------------------------------------------
 $('#gallery').addEventListener('change', e => {      // one listener for all three boxes
  const inp = e.target, f = inp.files && inp.files[0];
  if (!f) return;
  const lab = inp.closest('label');
  let img = lab.querySelector('img');
  if (!img) { img = document.createElement('img'); img.alt = 'Couple photo'; lab.appendChild(img); }
  img.src = URL.createObjectURL(f);
 });

 // ----------------------------------------------------------------------
 // RSVP - build a WhatsApp message (in the guest's chosen language)
 // ----------------------------------------------------------------------
 const form = $('#rsvpForm'), done = $('#done');
 form.addEventListener('change', e => {
  if (e.target.name === 'att') $('#guestsF').style.display = form.att.value === 'yes' ? '' : 'none';
 });
 try {
  const saved = JSON.parse(localStorage.getItem('rsvp') || 'null');
  if (saved) { $('#gName').value = saved.n || ''; $('#gDiet').value = saved.d || ''; }
 } catch (e) {}

 form.addEventListener('submit', e => {
  e.preventDefault();                                // stop the page from reloading
  const name = $('#gName').value.trim(), yes = form.att.value === 'yes';
  if (!name) { $('#err').textContent = T.errName; $('#gName').focus(); return; }
  $('#err').textContent = '';
  const diet = $('#gDiet').value.trim(), msg = $('#gMsg').value.trim();
  const lines = [T.waTitle, `${T.waName}: ${name}`, yes ? T.waYes.replace('{n}', $('#gNum').value) : T.waNo];
  if (yes && diet) lines.push(`${T.waDiet}: ${diet}`);
  if (msg) lines.push(`${T.waNote}: ${msg}`);
  $('#waLink').href = 'https://wa.me/?text=' + encodeURIComponent(lines.join('\n')); // makes spaces/newlines safe in a link
  const first = name.split(' ')[0];
  $('#doneTitle').textContent = (yes ? T.doneYes : T.doneNo).replace('{name}', first);
  $('#doneText').textContent = yes ? T.doneYesText : T.doneNoText;
  try { localStorage.setItem('rsvp', JSON.stringify({ n: name, d: diet })); } catch (e) {}
  form.style.display = 'none';
  done.classList.add('on');
  if (yes) { const b = $('#waLink').getBoundingClientRect(); fx.confetti(b.left + b.width / 2, b.top, 60); }
 });
 $('#edit').addEventListener('click', () => { done.classList.remove('on'); form.style.display = ''; });

 if (guestName) $('#gName').value = guestName;
 setLang(lang);
